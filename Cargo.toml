[workspace]
resolver = "3"
members = ["dns", "email", "secret", "server", "user-database", "validation"]

[workspace.dependencies]
#the core interfaces that are used by the server
# each of these crates will expose multiple implementors of their behavior 
# allowing for quick runtime switching between different dns providers, email providers, etc.
# 
# Each interface crate supports feature flags to compile only the providers you need:
#   dns: dummy (default), hickory, porkbun
#   email: dummy (default), lettre
#   user-database: dummy (default), csv, diesel
fckn-gay-dns = { path = "dns", default-features = true }
fckn-gay-email = { path = "email", default-features = true }
fckn-gay-secret = { path = "secret" }
fckn-gay-user-database = { path = "user-database", default-features = true }
fckn-gay-validation = { path = "validation" }

#all other dependencies
anyhow = { version = "1" }
async-trait = "0.1"
axum = { version = "0.8.3", default-features = false }
axum-extra = { version = "0.10.1", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
csv = { version = "1.3" }
diesel = { version = "2.3.2", features = ["chrono", "returning_clauses_for_sqlite_3_35", "sqlite", "uuid"] }
env_logger = "0.11"
getrandom = "0.3"
governor = "0.10.2"
hickory-server = "0.25.2"
lettre = { version = "0.11", default-features = false }
log = "0.4"
password-auth = "1.0"
porkbun-api = { version = "1.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", default-features = false }
toml = { version = "0.8" }
tower-http = { version = "0.6", default-features = false }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.clippy]
# allow for now because signatures might change  
new_without_default = "allow"

# For WASM builds
[profile.release]
lto = true
opt-level = "s"
