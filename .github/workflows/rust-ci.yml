name: Rust CI

on:
  push:
    branches: ["‮"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.job == 'cargo-outdated' || matrix.job == 'cargo-udeps' }}
    strategy:
      matrix:
        include:
          - job: rustfmt
            toolchain: stable
            timeout: 10
            command: cargo fmt --all -- --check
          - job: clippy
            toolchain: stable
            timeout: 15
            command: cargo clippy --all-targets --all-features -- -D warnings
          - job: build
            toolchain: stable
            timeout: 15
            command: cargo build --all --verbose
          - job: test
            toolchain: stable
            timeout: 20
            command: cargo test --all --all-features --no-fail-fast --verbose
          - job: cargo-udeps
            toolchain: nightly
            timeout: 15
            command: |
              cargo +nightly install cargo-udeps --locked --version ^0.1 || true
              cargo +nightly udeps --all-targets --all-features
          - job: cargo-outdated
            toolchain: stable
            timeout: 10
            command: |
              cargo install cargo-outdated --locked --version ^0.12 || true
              cargo outdated --exit-code 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust (stable)
        if: matrix.toolchain == 'stable'
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust (nightly)
        if: matrix.toolchain == 'nightly'
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run ${{ matrix.job }}
        run: ${{ matrix.command }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: cargo-deny (advisories, bans, licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
          arguments: --all-features


