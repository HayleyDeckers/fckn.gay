# what address should the server bind to? 
address = "127.0.0.1:8080"
# and what is the public suffix that should be exposed to the user?
# e.g. if this is "example.com", a user will be able to register as "their.username.example.com"
public_suffix = "is.fckn.gay"

# here we specify which provider we want to use for the 3 interfaces the server needs:
#  - a DNS interface for configuring the DNS,
#  - a user database interface for storing users login information and such, 
#  - an email interface for sending transactional emails like "confirm sign-up" and "reset password" 
# we set all three to "dummy" here, which is a simple testing interface without any set-up required.
dns.provider = "dummy"           # will simply keep an in-memory store of records, not persisted to disk
user_database.provider = "dummy" # will keep an in-memory store of users, not persisted to disk
email.provider = "dummy"         # will simply print emails to stdout

# and below we configure the providers. We've included set-up not just for the dummy interfaces,
# but also the more full-featured interfaces.
# Switching between them is as simple as updating the provider fields aboves

# The dummy DNS provider allows you to spin up quickly with minimal dependencies.
# New records are simply added to an in-memory hashmap. Changes are not persisted to disk.
[dns.dummy]
entries = [
  { name = "hayley.is.fckn.gay", record_type = "A", content = "127.0.0.1", ttl_seconds = 3600 },
  { name = "hayley.is.fckn.gay", record_type = "MX", content = "mail.fckn.gay", ttl_seconds = 3600 },
  # the username for this entry would be test
  { name = "this.test.is.fckn.gay", record_type = "A", content = "1.2.3.4", ttl_seconds = 3600 },
]

# the hickory provider spins up a full DNS server as part of the binary.
# it's not production ready yet but you can use this to deploy a fully functional prototype without 
# an external DNS provider.
# changes are persisted to a text file.
[dns.hickory]
file_path = "record.log"
# the address used by the DNS server, be sure to open the ports.
tcp_addr = "127.0.0.1:53"
udp_addr = "127.0.0.1:53"
# should be the same as the public suffix, plus a dot. We might remove this in the future.
zone_name = "is.fckn.gay."

# the porkbun provider allows you to use porkbun's DNS API
# through the `porkbun-api` crate ( https://crates.io/crates/porkbun-api )
# this requires you have an account and API key with them, and changes will be _live_.
[dns.porkbun]
# the domain you have registered at porkbun. Should be a substring of the public suffix.
domain = "fckn.gay"
# your credentials - secrets can be specified in three ways:
#   1. Direct value:       api_key = "YOUR_API_KEY"
#   2. From file:          api_key = { file = "/path/to/secret" }
#   3. From env variable:  api_key = { env = "PORKBUN_API_KEY" }
api_key = "YOUR_API_KEY"
secret_key = "YOUR_SECRET_KEY"

# the dummy database is configured with a list of username -> password pairs.
# changes made through the api are not persisted (it's just for testing!) 
# but you can add or remove entries using the server api
[user_database.dummy]
admin = "password"
test = "test"
hayley = "gayley"

# the diesel backend uses an SQLite database that is persisted to disk
# this is the most production ready option but requires more set-up.
[user_database.diesel]
database_url = "sqlite.db"

# no configuration needed for the dummy provider - it just prints to stdout!
[email.dummy]

# this config will actually send emails from the provided account.
# Be careful when using this one that you do not get flagged as spamming by your provider
# e.g. because you send emails with the wrong "from" adress.
[email.lettre]
smtp_server = "example.com"
smtp_port = 587
# credentials can also use { env = "VAR_NAME" } or { file = "/path/to/secret" }
username = "your_username@example.com"
password = "[password]"
# password = { env = "SMTP_PASSWORD" }
# password = { file = "secrets/smtp_password.txt" }

# Optional Cloudflare Turnstile captcha for sign-up protection.
# When enabled, the sign-up form will show a Turnstile widget and the server
# will verify the token before creating an account.
# If this section is absent, sign-up works without captcha.
#
# Get your keys at https://dash.cloudflare.com/?to=/:account/turnstile
# For local testing, Cloudflare provides test keys:
#   site_key    = "1x00000000000000000000AA"  (always passes)
#   secret_key  = "1x0000000000000000000000000000000AA"  (always passes)
#
[turnstile]
site_key = "1x00000000000000000000AA"
secret_key = "1x0000000000000000000000000000000AA"
# # secret_key = { env = "TURNSTILE_SECRET_KEY" }
# secret_key = { file = "secrets/turnstile_secret.txt" }

# Logging configuration
# The level filter uses the same syntax as RUST_LOG directives
# (e.g. "info", "debug", "my_crate=debug,tower_http=warn").
# Invalid filter strings will cause the config to fail to parse :3
[logging]
level = "info"

# Rate limiting to prevent abuse and brute-force attacks
# Rate limit info is exposed via X-RateLimit-* headers so clients can auto-backoff
[rate_limit]
# Auth routes (login, signup, etc) - rate limited by IP address
# Stricter limits help prevent brute-force password attacks
auth_burst_size = 10  # max requests before rate limiting kicks in
auth_per_seconds = 60 # seconds to replenish one request slot

# API routes - rate limited per authenticated user
# More generous limits since these are legitimate users
api_burst_size = 30  # max requests before rate limiting kicks in
api_per_seconds = 60 # seconds to replenish one request slot
