<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
    <meta charset="utf-8" />
    <script>
        async function try_login() {
            const element = document.getElementById("login_form");
            const form_data = new FormData(element);
            const data = new URLSearchParams(form_data);
            var response = await fetch("/login", {
                method: "POST",
                body: data
            });
            if (response.ok) {
                window.location.href = "/u/view.html";
            } else {
                alert("Login failed. Please try again.");
            }
        }
    </script>
</head>

<body>
    <h1>login required</h1>
    <form id="login_form" action="javascript:try_login()" method="post">
        <label for="username_">user:</label>
        <input type="text" id="username_" name="username">
        <label for="password_">password:</label>
        <input type="password" id="password_" name="password">
        <a href="./forgot-password.html" style="font-size: 0.85em; margin-top: -0.6em;">forgot password?</a>
        <input type="submit" value="Login">
        or <a href="./signup.html">signup</a>
    </form>
</body>

</html>
