<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <title>Forgot Password</title>
    <meta charset="utf-8" />
    <script>
        async function request_reset() {
            const element = document.getElementById("reset_form");
            const form_data = new FormData(element);
            const data = new URLSearchParams(form_data);

            const submitBtn = document.querySelector('input[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.value = "sending...";

            var response = await fetch("/request-password-reset", {
                method: "POST",
                body: data
            });

            const msg = document.getElementById("message");
            if (response.ok) {
                msg.textContent = "if an account with that username or email exists, we sent a reset link! go check ur inbox :3";
                msg.style.color = "#44aa44";
                msg.style.display = "block";
                element.style.display = "none";
            } else if (response.status === 429) {
                msg.textContent = "whoa slow down bestie, too many requests 😭 try again in a bit";
                msg.style.color = "#ff4444";
                msg.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.value = "send reset link";
            } else {
                msg.textContent = "something broke on our end, sorry 💀 try again later?";
                msg.style.color = "#ff4444";
                msg.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.value = "send reset link";
            }
        }
    </script>
    <style>
        #message {
            display: none;
            margin-top: 1em;
            padding: 1em;
            border-radius: 12px;
            background: #fff6f6cc;
            font-size: 1.05em;
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>forgot password?</h1>
    <form id="reset_form" action="javascript:request_reset()" method="post">
        <p>no worries bestie, it happens to the best of us</p>
        <label for="username_or_email_">username or email:</label>
        <input type="text" id="username_or_email_" name="username_or_email" required>
        <input type="submit" value="send reset link">
    </form>
    <div id="message"></div>
    <a href="./index.html">back to login</a>
</body>

</html>
