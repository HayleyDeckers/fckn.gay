<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <title>Signup</title>
    <meta charset="utf-8" />
    <script type="module">
        import init, { validate_username_wasm, validate_password_wasm, validate_credentials_wasm } from './fckn_gay_validation.js';

        let wasmModule = null;

        // Initialize WASM module
        async function initWasm() {
            try {
                console.log('Attempting to load WASM module...');
                wasmModule = await init('./fckn_gay_validation_bg.wasm');
                console.log('WASM validation module loaded successfully!');
            } catch (error) {
                console.error('Failed to load WASM module:', error);
                console.error('Error details:', error.message);
                console.error('Stack trace:', error.stack);
            }
        }

        // Initialize on page load
        initWasm();

        // Validation functions
        function validateUsername(username) {
            if (!wasmModule) return { is_valid: true, errors: [] };
            try {
                const result = validate_username_wasm(username);
                return JSON.parse(result);
            } catch (error) {
                console.error('Username validation error:', error);
                return { is_valid: true, errors: [] };
            }
        }

        function validatePassword(password) {
            if (!wasmModule) return { is_valid: true, errors: [] };
            try {
                const result = validate_password_wasm(password);
                return JSON.parse(result);
            } catch (error) {
                console.error('Password validation error:', error);
                return { is_valid: true, errors: [] };
            }
        }

        function validateCredentials(username, password) {
            if (!wasmModule) return { is_valid: true, errors: [] };
            try {
                const result = validate_credentials_wasm(username, password);
                return JSON.parse(result);
            } catch (error) {
                console.error('Credentials validation error:', error);
                return { is_valid: true, errors: [] };
            }
        }

        // Error display functions
        function showFieldError(fieldId, errors) {
            const field = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + '_error');

            if (errors.length > 0) {
                field.style.borderColor = '#ff4444';
                field.style.backgroundColor = '#ffe6e6';
                if (errorDiv) {
                    errorDiv.innerHTML = errors.join('<br>');
                    errorDiv.style.display = 'block';
                }
            } else {
                field.style.borderColor = '#44ff44';
                field.style.backgroundColor = '#e6ffe6';
                if (errorDiv) {
                    errorDiv.style.display = 'none';
                }
            }
        }

        function clearFieldError(fieldId) {
            const field = document.getElementById(fieldId);
            const errorDiv = document.getElementById(fieldId + '_error');

            field.style.borderColor = '';
            field.style.backgroundColor = '';
            if (errorDiv) {
                errorDiv.style.display = 'none';
            }
        }

        // Real-time validation
        function setupValidation() {
            const usernameField = document.getElementById('username_');
            const passwordField = document.getElementById('password_');

            usernameField.addEventListener('input', function () {
                const result = validateUsername(this.value);
                showFieldError('username_', result.errors);
            });

            passwordField.addEventListener('input', function () {
                const result = validatePassword(this.value);
                showFieldError('password_', result.errors);
            });
        }

        // Setup validation when DOM is ready
        document.addEventListener('DOMContentLoaded', setupValidation);

        async function try_signup() {
            // Check if WASM module is loaded
            if (!wasmModule) {
                alert("Validation system is still loading. Please wait a moment and try again.");
                return;
            }
            
            const element = document.getElementById("signup_form");
            const form_data = new FormData(element);
            const data = new URLSearchParams(form_data);
            
            const username = form_data.get('username');
            const password = form_data.get('password');
            
            // Client-side validation
            const validation = validateCredentials(username, password);
            if (!validation.is_valid) {
                showFieldError('username_', validation.errors.filter(e => e.includes('Username')));
                showFieldError('password_', validation.errors.filter(e => e.includes('Password')));
                alert("Please fix the validation errors before submitting.");
                return;
            }
            
            var response = await fetch("/signup", {
                method: "POST",
                body: data
            });
            if (response.ok) {
                alert("Signup successful! Please check your email to verify your account.");
            } else if (response.status == 409) {
                alert("Username already taken. Please choose another.");
            } else {
                alert("Signup failed. Please try again.");
            }
        }
    </script>
    <style>
        .error-message {
            color: #ff4444;
            font-size: 0.9em;
            margin-top: 4px;
            display: none;
        }

        input.error {
            border-color: #ff4444 !important;
            background-color: #ffe6e6 !important;
        }

        input.valid {
            border-color: #44ff44 !important;
            background-color: #e6ffe6 !important;
        }
    </style>
</head>

<body>
    <h1>signup</h1>
    <form id="signup_form" action="javascript:try_signup()" method="post">
        <label for="username_">user:</label>
        <input type="text" id="username_" name="username">
        <div id="username__error" class="error-message"></div><br><br>

        <label for="password_">password:</label>
        <input type="password" id="password_" name="password">
        <div id="password__error" class="error-message"></div><br><br>

        <label for="email_">email:</label>
        <input type="email" id="email_" name="email"><br><br>

        <input type="submit" value="Sign Up">
    </form>
    already have an account? <a href="./index.html"> go to login</a>
</body>

</html>
