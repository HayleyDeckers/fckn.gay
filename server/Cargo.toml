[package]
name = "fckn-gay-server"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
# interfaces
fckn-gay-dns.workspace = true
fckn-gay-email.workspace = true
fckn-gay-user-database.workspace = true
fckn-gay-validation.workspace = true

# other dependencies
anyhow.workspace = true
axum = { workspace = true, features = ["form", "http1", "http2", "json", "tokio"] }
axum-extra = { workspace = true, features = ["cookie"] }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true
tower-http = { workspace = true, features = ["catch-panic", "fs"] }
