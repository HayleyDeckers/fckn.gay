[package]
name = "fckn-gay-server"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
# interfaces
fckn-gay-dns = { workspace = true, features = ["dummy"] }
fckn-gay-email = { workspace = true, features = ["dummy"] }
fckn-gay-secret.workspace = true
fckn-gay-user-database = { workspace = true, features = ["dummy"] }
fckn-gay-validation.workspace = true

# other dependencies
anyhow.workspace = true
axum = { workspace = true, features = ["form", "http1", "http2", "json", "tokio"] }
axum-extra = { workspace = true, features = ["cookie"] }
clap = { version = "4.5.60", features = ["derive"] }
getrandom.workspace = true
governor.workspace = true
log.workspace = true
reqwest.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
toml.workspace = true
tower-http = { workspace = true, features = ["catch-panic", "fs"] }
tower_governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
